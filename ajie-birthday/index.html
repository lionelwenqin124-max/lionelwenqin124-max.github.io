<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><link rel="icon" href="data:,"><title>Jay's Birthday Party 🎂</title>
<style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;overflow:hidden;background:#ffe6f0;touch-action:pinch-zoom;overscroll-behavior:none}
body{font-family:"Chalkboard SE","Comic Sans MS","Arial Rounded MT Bold","Nunito","PingFang TC","Microsoft JhengHei",sans-serif}
#stage{position:absolute;left:50%;top:50%;width:1280px;height:720px;transform-origin:center center;overflow:hidden;border-radius:18px;background:#fff8e7}
#bg{position:absolute;inset:0;background-size:cover;background-position:center;transition:opacity .5s}
#world,#ui{position:absolute;inset:0}
#ui{pointer-events:none}#ui>*{pointer-events:auto}
.clip{position:absolute;left:0;top:0;width:1280px;height:470px;overflow:hidden;pointer-events:none}
.clip .spr,.clip .chair{pointer-events:auto}
.spr{position:absolute;transform-origin:50% 100%;touch-action:none}
.spr>img{width:100%;height:100%;display:block;transform-origin:50% 100%;pointer-events:none;-webkit-user-drag:none}
.idle>img{animation:bob 2.6s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0) scale(1,1)}50%{transform:translateY(-6px) scale(1.02,.98)}}
.drag{cursor:grab;filter:drop-shadow(0 6px 4px rgba(0,0,0,.18))}
.held{z-index:60!important;filter:drop-shadow(0 18px 10px rgba(0,0,0,.25))}
.held>img{animation:none!important;transform:scale(1.15)}
.sel>img{animation:pulse .8s ease-in-out infinite!important}
@keyframes pulse{0%,100%{transform:scale(1.05)}50%{transform:scale(1.18)}}
.glow{filter:drop-shadow(0 0 10px #ffe34d) drop-shadow(0 0 18px #ffb300)!important}
.label{position:absolute;left:50%;bottom:-30px;transform:translateX(-50%);background:#fff;border:3px solid #6b3e26;border-radius:14px;padding:0 10px;font-size:22px;color:#6b3e26;white-space:nowrap;pointer-events:none}
#cap{position:absolute;left:150px;right:150px;top:12px;min-height:110px;background:rgba(255,255,255,.95);border:5px solid #6b3e26;border-radius:28px;padding:10px 20px 10px 96px;box-shadow:0 6px 0 rgba(107,62,38,.35);display:none}
#cap.show{display:block;animation:capin .35s cubic-bezier(.2,1.6,.4,1)}
@keyframes capin{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
#en{font-size:42px;line-height:1.15;color:#3b2314;font-weight:bold}
#en span{display:inline-block;padding:0 3px;border-radius:10px;transition:background .15s,transform .15s}
#en span.on{background:#ffe066;transform:scale(1.12)}
#zhrow{display:flex;align-items:center;gap:12px;margin-top:6px}
#zh{font-size:28px;color:#7a5a45;filter:blur(9px);opacity:.55;transition:filter .15s,opacity .15s}
#zh.show{filter:none;opacity:1}
.btn{border:none;background:#ffcc33;border-radius:50%;box-shadow:0 5px 0 #c98a00;font-size:40px;width:76px;height:76px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-family:inherit;color:#3b2314}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #c98a00}
#say{position:absolute;left:12px;top:16px}
#hide{width:auto;height:44px;border-radius:22px;font-size:22px;padding:0 14px;background:#ffd6e7;box-shadow:0 4px 0 #e48fb3}
#next{position:absolute;right:26px;bottom:26px;width:120px;height:120px;font-size:64px;background:#7ed957;box-shadow:0 7px 0 #3f9a22;display:none}
#next.show{display:flex;animation:nextp 1s ease-in-out infinite}
@keyframes nextp{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
#menuBtn{position:absolute;left:14px;top:14px;width:60px;height:60px;font-size:30px;background:#fff;box-shadow:0 4px 0 #bbb;opacity:.85}
#stars{position:absolute;right:14px;top:14px;display:flex;gap:2px;background:rgba(255,255,255,.85);border-radius:20px;padding:4px 10px;font-size:26px}
#stars span{filter:grayscale(1);opacity:.35;transition:all .4s}#stars span.on{filter:none;opacity:1;animation:capin .5s}
#tray{position:absolute;left:150px;right:150px;bottom:10px;height:150px;background:rgba(255,248,230,.92);border:5px solid #c99b6d;border-radius:30px;display:none}
#tray.show{display:block}
.overlay{position:absolute;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;z-index:100}
.overlay.show{display:flex}
#start{background:radial-gradient(circle at 50% 40%,#fff5c2,#ffb3d1)}
#start h1{font-size:72px;color:#e0457b;margin:0;text-shadow:0 5px 0 #fff;text-align:center}
#start h2{font-size:34px;color:#7a5a45;margin:6px 0 20px}
#startRow{display:flex;gap:36px;align-items:center;justify-content:center;margin-top:8px}
#go,#goHard{width:250px;height:210px;flex-direction:column;gap:6px;font-size:56px;border-radius:40px;color:#fff}
#go{background:#ff5f8f;box-shadow:0 10px 0 #b8325c;animation:nextp 1.2s infinite}
#goHard{background:#6e8cff;box-shadow:0 10px 0 #3a58c8;font-size:34px;line-height:1.1;padding:8px 10px}
#go i,#goHard i{font-style:normal;font-size:20px;font-weight:normal;color:rgba(255,255,255,.96);padding:0 10px;text-align:center;line-height:1.25}
#menu{background:rgba(60,30,20,.55)}
#menu .box{background:#fff;border-radius:30px;padding:24px 30px;display:grid;grid-template-columns:1fr 1fr;gap:14px;max-width:820px}
#menu button{font-family:inherit;font-size:28px;border:none;border-radius:20px;padding:14px 18px;background:#ffe9a8;box-shadow:0 5px 0 #d4ae3c;cursor:pointer;color:#3b2314;text-align:left}
#menu .t{grid-column:1/3;font-size:26px;color:#7a5a45;text-align:center}
#end{background:radial-gradient(circle,#fff7cc,#ffc1dc)}
#end h1{font-size:90px;color:#e0457b;margin:0;text-shadow:0 6px 0 #fff}
#end .big{font-size:80px;letter-spacing:10px;margin:10px 0 30px}
#fx{position:absolute;inset:0;pointer-events:none;z-index:90}
.bubble{position:absolute;background:#fff;border:4px solid #6b3e26;border-radius:24px;padding:8px 16px;font-size:30px;color:#3b2314;white-space:nowrap;z-index:80;pointer-events:none;transform:translate(-50%,-100%);animation:capin .3s cubic-bezier(.2,1.6,.4,1)}
.chair{position:absolute;width:150px;height:175px;top:300px;border-radius:40px 40px 10px 10px;border:5px solid #6b3e26;transition:box-shadow .3s}
.chair.open{box-shadow:0 0 0 8px #fff27a,0 0 30px 12px #ffcf33;animation:nextp 1s infinite}
.bin{position:absolute;font-size:120px;line-height:1}
#mic{position:absolute;right:26px;bottom:160px;width:110px;height:110px;font-size:56px;background:#9ad0ff;box-shadow:0 6px 0 #4a8fcc;display:none}
#mic.show{display:flex}#mic.rec{background:#ff7f7f;box-shadow:0 0 0 12px rgba(255,80,80,.35)}
#rot{display:none;position:fixed;inset:0;background:#ffb3d1;z-index:200;align-items:center;justify-content:center;font-size:40px;color:#fff;text-align:center}
@media (orientation:portrait) and (max-width:900px){#rot{display:flex}}
.title{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);background:#fff;border:6px solid #6b3e26;border-radius:36px;padding:22px 44px;text-align:center;z-index:85;animation:capin .4s cubic-bezier(.2,1.6,.4,1)}
.title b{display:block;font-size:56px;color:#e0457b}.title i{font-style:normal;font-size:30px;color:#7a5a45}
.hand{position:absolute;font-size:110px;line-height:1;width:130px;height:130px;text-align:center;transform-origin:50% 100%}
.tray-p,.sink{position:absolute}
.sink{border-radius:30px}
.sink.glow{box-shadow:0 0 0 6px #fff27a,0 0 30px 12px #ffcf33}
.bin.glow{filter:drop-shadow(0 0 12px #ffcf33)}

.locked{opacity:.62;filter:grayscale(.35)}
.locked>img{animation:none!important}
.lockb{position:absolute;right:-8px;top:-10px;font-size:30px;filter:drop-shadow(0 2px 0 #fff);pointer-events:none;z-index:2}
#hardBadge{position:absolute;right:14px;top:58px;display:none;background:#ff5f8f;color:#fff;font-weight:bold;font-size:16px;padding:3px 12px;border-radius:12px;letter-spacing:1px;box-shadow:0 3px 0 #b8325c;pointer-events:none}
#hardBadge.show{display:block}
#hardMic{position:absolute;right:26px;bottom:160px;width:130px;height:130px;font-size:70px;background:#9ad0ff;box-shadow:0 6px 0 #4a8fcc;display:none;z-index:50}
#hardMic.show{display:flex}#hardMic.rec{background:#ff7f7f;box-shadow:0 0 0 12px rgba(255,80,80,.35)}
#teach{position:absolute;left:14px;bottom:26px;width:100px;height:100px;font-size:44px;background:#b8f08a;box-shadow:0 5px 0 #5aaa2a;display:none;flex-direction:column;z-index:50;line-height:1}
#teach i{font-style:normal;font-size:12px;line-height:1.15;text-align:center;padding:0 4px;margin-top:2px}
#teach.show{display:flex}
#teach.need{background:#7ed957;box-shadow:0 0 0 10px rgba(126,217,87,.45);animation:nextp 1s ease-in-out infinite}
#teachHint{position:absolute;left:14px;bottom:136px;background:#fff;border:3px solid #6b3e26;border-radius:12px;padding:4px 10px;font-size:18px;color:#3b2314;display:none;z-index:50;pointer-events:none;white-space:nowrap}
#teach.need + #teachHint,#teachHint.show{display:block}
#sayPrompt{position:absolute;left:50%;bottom:168px;transform:translateX(-50%);background:#fff7cc;border:4px solid #6b3e26;border-radius:24px;padding:8px 28px;font-size:32px;color:#3b2314;display:none;z-index:40;white-space:nowrap;pointer-events:none}
#sayPrompt.show{display:block;animation:capin .35s cubic-bezier(.2,1.6,.4,1)}

#unzoom{display:none;position:fixed;left:0;top:0;transform-origin:0 0;z-index:9999;margin:12px;padding:14px 22px;font-size:26px;font-weight:700;border:4px solid #fff;border-radius:22px;background:#ff5f8f;color:#fff;box-shadow:0 6px 16px rgba(0,0,0,.25);touch-action:manipulation}
#unzoom.show{display:block}
</style></head><body>
<div id="stage">
 <div id="bg"></div><div id="world"></div>
 <canvas id="fx" width="1280" height="720"></canvas>
 <div id="ui">
  <div id="cap"><button class="btn" id="say" aria-label="read aloud">🔊</button><div id="en"></div>
   <div id="zhrow"><button class="btn" id="hide">🙈 中文</button><div id="zh"></div></div></div>
  <div id="tray"></div>
  <button class="btn" id="next" aria-label="next">➡️</button>
  <button class="btn" id="mic" aria-label="say it">🎤</button>
  <button class="btn" id="hardMic" aria-label="say the names">🎤</button>
  <button class="btn" id="teach" aria-label="老師：他說了">✓<i>老師：他說了</i></button>
  <div id="teachHint">老師按 ✓</div>
  <div id="sayPrompt">Say the names! 說出名字！</div>
  <button class="btn" id="menuBtn" aria-label="menu">☰</button>
  <div id="stars"><span>⭐</span><span>⭐</span><span>⭐</span><span>⭐</span><span>⭐</span></div>
  <div id="hardBadge">HARD</div>
 </div>
 <div class="overlay show" id="start"><h1>Jay's Birthday Party</h1><h2>Jay 的生日派對 🎂</h2>
  <div id="startRow"><button class="btn" id="go">GO!<i>開始</i></button>
   <button class="btn" id="goHard">Hard mode 🎤<i>困難模式<br>先說出名字</i></button></div></div>
 <div class="overlay" id="menu"><div class="box"><div class="t">老師選單 Teacher menu</div>
  <button data-p="0">🏠 Intro 開場</button><button data-p="1">🐱 1. Set the table 擺餐桌</button>
  <button data-p="2">👨‍👩‍👧 2. My family 家人座位</button><button data-p="3">🥛 3. I want… 我想要</button>
  <button data-p="4">🫧 4. Wash the dishes 洗碗</button><button data-p="5">👋 5. Goodbye 說再見</button>
  <button data-p="6">🎉 The end 結束</button><button data-p="x">✖ Close 關閉</button></div></div>
 <div class="overlay" id="end"><h1>Great job, 阿傑!</h1><div class="big">⭐⭐⭐⭐⭐</div><button class="btn" id="again" style="width:auto;padding:0 40px;border-radius:40px;font-size:40px">🔁 Play again</button></div>
</div>
<div id="rot">🔄<br>請把 iPad 轉成橫向<br>Turn the iPad sideways</div>

<script>(()=>{
'use strict';
const A=window.ASSETS, C=window.CFG, $=s=>document.querySelector(s);
const stage=$('#stage'), world=$('#world'), bg=$('#bg'), cap=$('#cap');
const ABORT={abort:1};
const G=window.G={scale:1,speed:1,run:0,expect:null,selected:null,done:[0,0,0,0,0,0],log:[],seats:null,part:-1,hard:false,hardWait:false};
const P=C.people, I=C.items;

/* ---------- layout ---------- */
function fit(){const s=Math.min(innerWidth/1280,innerHeight/720);G.scale=s;stage.style.transform=`translate(-50%,-50%) scale(${s})`;}
addEventListener('resize',fit);fit();
const pt=e=>{const r=stage.getBoundingClientRect();return{x:(e.clientX-r.left)/G.scale,y:(e.clientY-r.top)/G.scale};};

/* ---------- flow helpers (abort-safe) ---------- */
function guard(p){const t=G.run;return p.then(v=>{if(t!==G.run)throw ABORT;return v;});}
const sleep=ms=>guard(new Promise(r=>setTimeout(r,ms*G.speed)));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}return a;};

/* ---------- sound ---------- */
let AC=null;
function ac(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC;}
function tone(f1,f2,d,type='sine',v=.15,dl=0){const a=ac();if(!a)return;const t=a.currentTime+dl,o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(f1,t);o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+.05);}
const sfx={pop(){tone(520,950,.1,'sine',.18);},chime(){[784,988,1175,1568].forEach((f,i)=>tone(f,f*1.01,.28,'triangle',.12,i*.08));},
 boing(){tone(360,250,.22,'sine',.1);},bub(){for(let i=0;i<8;i++)tone(700+Math.random()*900,1300+Math.random()*700,.07,'sine',.06,i*.07);},
 yay(){[523,659,784,1047,784,1047].forEach((f,i)=>tone(f,f,.22,'square',.045,i*.11));},
 hbd(){const n=[[392,.3],[392,.15],[440,.45],[392,.45],[523,.45],[494,.8]];let t=0;n.forEach(([f,d])=>{tone(f,f,d,'triangle',.12,t);t+=d;});}};

/* ---------- speech ---------- */
const TTS={voice:null,ok:'speechSynthesis' in window};
function pickVoice(){if(!TTS.ok)return;const vs=speechSynthesis.getVoices().filter(v=>/^en[-_]US/i.test(v.lang));
 const pref=['Samantha','Google US English','Aria','Jenny','Ava','Allison','Susan','Karen'];
 TTS.voice=vs.find(v=>pref.some(p=>v.name.includes(p)))||vs.find(v=>/female/i.test(v.name))||vs[0]||null;}
if(TTS.ok){pickVoice();speechSynthesis.onvoiceschanged=pickVoice;}
let hlTimer=null;
function say(text,o={}){
 const spans=o.hl?[...document.querySelectorAll('#en span')]:[];
 clearInterval(hlTimer);spans.forEach(s=>s.classList.remove('on'));
 return guard(new Promise(res=>{
  let fin=false;const end=()=>{if(fin)return;fin=true;clearInterval(hlTimer);spans.forEach(s=>s.classList.remove('on'));res();};
  const est=900+text.length*80;
  if(!TTS.ok){setTimeout(end,est*.5);return;}
  try{speechSynthesis.cancel();}catch(e){}
  const u=new SpeechSynthesisUtterance(text);u.lang='en-US';if(TTS.voice)u.voice=TTS.voice;u.rate=o.rate||.85;u.pitch=o.pitch||1.1;
  let gotB=false;
  if(spans.length){const starts=[];let c=0;spans.forEach(s=>{starts.push(c);c+=s.textContent.length+1;});
   u.onboundary=e=>{if(e.name&&e.name!=='word')return;gotB=true;clearInterval(hlTimer);let k=0;starts.forEach((s,i)=>{if(e.charIndex>=s)k=i;});spans.forEach((s,i)=>s.classList.toggle('on',i===k));};
   u.onstart=()=>{let k=0;const step=(est-600)/spans.length;hlTimer=setInterval(()=>{if(gotB){clearInterval(hlTimer);return;}spans.forEach((s,i)=>s.classList.toggle('on',i===k));k++;if(k>spans.length){clearInterval(hlTimer);spans.forEach(s=>s.classList.remove('on'));}},step);};}
  u.onend=u.onerror=end;
  speechSynthesis.speak(u);setTimeout(end,est+1500);
 }));
}
function line(en,zh,o={}){
 G.line={en,zh,o};const e=$('#en');e.innerHTML='';
 en.split(' ').forEach(w=>{const s=document.createElement('span');s.textContent=w;e.appendChild(s);e.appendChild(document.createTextNode(' '));});
 $('#zh').textContent=zh;$('#zh').classList.remove('show');cap.classList.remove('show');void cap.offsetWidth;cap.classList.add('show');
 return say(en,Object.assign({hl:true},o)).catch(()=>{});
}
$('#say').addEventListener('pointerup',e=>{e.stopPropagation();if(G.line)say(G.line.en,Object.assign({hl:true},G.line.o)).catch(()=>{});});
$('#en').addEventListener('pointerup',()=>{if(G.line)say(G.line.en,Object.assign({hl:true},G.line.o)).catch(()=>{});});
let zhT=null;const zhEl=$('#zh'),hideB=$('#hide');
hideB.addEventListener('pointerdown',e=>{e.preventDefault();clearTimeout(zhT);zhEl.classList.add('show');});
['pointerup','pointercancel','pointerleave'].forEach(ev=>hideB.addEventListener(ev,()=>{clearTimeout(zhT);zhT=setTimeout(()=>zhEl.classList.remove('show'),1500);}));

/* ---------- sprites & animation ---------- */
function spr(name,x,y,h,o={}){
 const a=A[name];let w=h*a.w/a.h;if(o.maxW&&w>o.maxW){w=o.maxW;h=w*a.h/a.w;}
 const d=document.createElement('div');d.className='spr'+(o.idle===false?'':' idle');d.dataset.n=name;
 const img=new Image();img.src=a.src;img.alt=name;img.draggable=false;img.style.animationDelay=(-Math.random()*2.6).toFixed(2)+'s';d.appendChild(img);
 if(o.label){const l=document.createElement('div');l.className='label';l.textContent=o.label;d.appendChild(l);}
 d._w=w;d._h=h;d.style.width=w+'px';d.style.height=h+'px';(o.parent||world).appendChild(d);place(d,x,y);return d;}
function box(cls,html,x,y,w,h,parent){const d=document.createElement('div');d.className=cls;d.innerHTML=html||'';d._w=w;d._h=h;d.style.width=w+'px';d.style.height=h+'px';(parent||world).appendChild(d);place(d,x,y);return d;}
function place(d,x,y){d._x=x;d._y=y;d.style.left=(x-d._w/2)+'px';d.style.top=(y-d._h)+'px';}
function flyTo(d,x,y,ms=450,ease='cubic-bezier(.3,1.35,.5,1)'){return new Promise(r=>{const fx=d._x,fy=d._y;place(d,x,y);
 try{d.animate([{transform:`translate(${fx-x}px,${fy-y}px)`},{transform:'translate(0,0)'}],{duration:Math.max(1,ms*G.speed),easing:ease});}catch(e){}setTimeout(r,ms*G.speed+30);});}
function anim(d,kf,ms,it=1){try{return d.animate(kf,{duration:Math.max(1,ms*G.speed),iterations:it,easing:'ease-out'});}catch(e){}}
const hop=(d,n=1)=>d&&anim(d,[{transform:'none'},{transform:'scale(1.12,.86)',offset:.18},{transform:'translateY(-55px) scale(.92,1.1)',offset:.5},{transform:'scale(1.1,.9)',offset:.82},{transform:'none'}],560,n);
const wiggle=(d,n=2)=>d&&anim(d,[{transform:'rotate(0)'},{transform:'rotate(-9deg)'},{transform:'rotate(9deg)'},{transform:'rotate(-6deg)'},{transform:'rotate(0)'}],520,n);
const wave=(d,n=3)=>d&&anim(d,[{transform:'rotate(0)'},{transform:'rotate(-14deg)'},{transform:'rotate(10deg)'},{transform:'rotate(0)'}],420,n);
const popIn=d=>d&&anim(d,[{transform:'scale(0)'},{transform:'scale(1.25,.85)',offset:.6},{transform:'scale(1)'}],420);
function bubble(txt,x,y,ms=1400){const b=document.createElement('div');b.className='bubble';b.textContent=txt;b.style.left=x+'px';b.style.top=y+'px';world.appendChild(b);setTimeout(()=>b.remove(),ms);return b;}
function title(b,i,ms=1500){const d=document.createElement('div');d.className='title';d.innerHTML=`<b>${b}</b><i>${i||''}</i>`;world.appendChild(d);setTimeout(()=>{anim(d,[{opacity:1},{opacity:0}],300);setTimeout(()=>d.remove(),280);},ms*G.speed);}
const setBg=n=>{bg.style.backgroundImage=`url(${A[n].src})`;};

/* ---------- confetti / stars ---------- */
const cx=$('#fx').getContext('2d');let parts=[],raf=0;const COLS=['#ff5f8f','#ffcc33','#7ed957','#5bc0ff','#b48cff','#ff9f43'];
function burst(x,y,n=16,star=true,spd=9){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=spd*(.4+Math.random());parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-3,g:.35,c:COLS[i%6],s:8+Math.random()*10,r:0,vr:.2,life:50+Math.random()*25,star});}go();}
function confetti(n=120){for(let i=0;i<n;i++)parts.push({x:Math.random()*1280,y:-20-Math.random()*300,vx:(Math.random()-.5)*3,vy:2+Math.random()*3,g:.06,c:COLS[i%6],s:8+Math.random()*8,r:Math.random()*6,vr:(Math.random()-.5)*.3,life:260,star:Math.random()<.25});go();}
function bubbles(x,y,n=18){for(let i=0;i<n;i++)parts.push({x:x+(Math.random()-.5)*220,y:y+Math.random()*40,vx:(Math.random()-.5)*1.5,vy:-1.5-Math.random()*3,g:-.01,c:'bub',s:10+Math.random()*22,life:70+Math.random()*40});go();}
function starPath(x,y,r){cx.beginPath();for(let i=0;i<10;i++){const a=i*Math.PI/5-Math.PI/2,rr=i%2?r*.45:r;cx.lineTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr);}cx.closePath();}
function go(){if(!raf)raf=requestAnimationFrame(tick);}
function tick(){cx.clearRect(0,0,1280,720);parts=parts.filter(p=>p.life-->0&&p.y<760);
 for(const p of parts){p.vy+=p.g;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr||0;cx.globalAlpha=Math.min(1,p.life/25);
  if(p.c==='bub'){cx.strokeStyle='rgba(120,190,255,.9)';cx.fillStyle='rgba(220,240,255,.45)';cx.lineWidth=3;cx.beginPath();cx.arc(p.x,p.y,p.s,0,6.28);cx.fill();cx.stroke();cx.fillStyle='#fff';cx.beginPath();cx.arc(p.x-p.s*.35,p.y-p.s*.35,p.s*.2,0,6.28);cx.fill();}
  else if(p.star){cx.fillStyle=p.c;starPath(p.x,p.y,p.s);cx.fill();}
  else{cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillStyle=p.c;cx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);cx.restore();}}
 cx.globalAlpha=1;raf=parts.length?requestAnimationFrame(tick):0;if(!raf)cx.clearRect(0,0,1280,720);}

/* ---------- next button ---------- */
const nextB=$('#next');let nextRes=null;
nextB.addEventListener('pointerup',e=>{e.stopPropagation();if(nextRes){const r=nextRes;nextRes=null;nextB.classList.remove('show');sfx.pop();r();}});
function waitNext(){nextB.classList.add('show');return guard(new Promise(r=>{nextRes=r;}));}

/* ---------- drag / tap rounds ---------- */
function hit(el,e,pad=34){const r=el.getBoundingClientRect(),p=pad*G.scale;return e.clientX>=r.left-p&&e.clientX<=r.right+p&&e.clientY>=r.top-p&&e.clientY<=r.bottom+p;}
function round(o){ // o: items[], targets[], ok(it,tg), hint(miss), tapTo(it)->tg, tapItem, expect, onPick(it)
 return guard(new Promise(res=>{
  let done=false,miss=0;G.expect=o.expect||null;G.selected=null;
  const clean=()=>{o.items.forEach(it=>{it.onpointerdown=it.onpointermove=it.onpointerup=it.onpointercancel=null;it.classList.remove('drag','sel','held');});o.targets.forEach(t=>{t.onpointerup=null;t.classList.remove('glow');});G.expect=null;G.selected=null;};
  const tryDrop=(it,tg,at)=>{if(done)return true;if(tg&&o.ok(it,tg)){done=true;clean();G.log.push((it.dataset.item||it.dataset.n)+'>'+(tg.dataset.t||''));res({it,tg});return true;}
   const now=Date.now();if(now-(G.lastTry||0)<1300)return false;G.lastTry=now;
   miss++;sfx.boing();const p=at||{x:it._x,y:it._y-it._h};document.querySelectorAll('.bubble.try').forEach(b=>b.remove());const bb=bubble('Try again! 😊',p.x,p.y-10);bb.classList.add('try');say('Try again!',{pitch:1.3}).catch(()=>{});if(o.hint)o.hint(miss);return false;};
  o.items.forEach(it=>{it.classList.add('drag');
   it.onpointerdown=e=>{if(done)return;e.preventDefault();e.stopPropagation();try{it.setPointerCapture(e.pointerId);}catch(_){}
    const p=pt(e),off={x:p.x-it._x,y:p.y-it._y},home={x:it._x,y:it._y};let moved=false;it.classList.add('held');sfx.pop();if(o.onPick)o.onPick(it);
    it.onpointermove=e2=>{const q=pt(e2);if(!moved&&Math.hypot(q.x-p.x,q.y-p.y)>14)moved=true;if(moved){place(it,q.x-off.x,q.y-off.y);o.targets.forEach(t=>t.classList.toggle('glow',hit(t,e2)));}};
    it.onpointerup=it.onpointercancel=e2=>{it.onpointermove=it.onpointerup=it.onpointercancel=null;it.classList.remove('held');o.targets.forEach(t=>t.classList.remove('glow'));if(done)return;
     if(!moved){const tg=o.tapTo?o.tapTo(it):(o.targets.length===1?o.targets[0]:null);
      if(tg){tryDrop(it,tg);}else{G.selected=it;o.items.forEach(i=>i.classList.toggle('sel',i===it));}return;}
     const q=pt(e2);const tg=o.targets.find(t=>hit(t,e2));
     if(!(tg&&tryDrop(it,tg,q))){if(!tg){sfx.boing();}flyTo(it,home.x,home.y,380);}};
   };});
  o.targets.forEach(t=>{t.onpointerup=e=>{if(done)return;e.stopPropagation();if(G.selected){const it=G.selected;if(!tryDrop(it,t)){}}else if(o.tapItem){tryDrop(o.tapItem,t);}};});
 }));
}
function choices(correct,pool,n=3){return shuffle([correct,...shuffle(pool.filter(x=>x!==correct)).slice(0,n-1)]);}
function trayPanel(l=150,r=1130){const t=box('tray-p','',(l+r)/2,712,r-l,140);t.style.cssText+=';background:rgba(255,248,230,.94);border:5px solid #c99b6d;border-radius:30px';return t;}
function layoutTray(ids,l=150,r=1130,y=670,h=112){const n=ids.length,els=[];ids.forEach((id,i)=>{const x=l+(r-l)*(i+.5)/n;const d=spr(id,x,y,h,{maxW:150,label:I[id]?I[id].en:P[id].en});d.dataset.item=id;d.style.zIndex=20;popIn(d);els.push(d);});return els;}
function sayWord(it){const id=it.dataset.item;const w=I[id]?I[id].en:(P[id]?P[id].en:id);say(w,{rate:.8}).catch(()=>{});}
function praise(x,y){sfx.chime();burst(x,y,18);}

/* ---------- hard mode: say names before dragging ---------- */
const ALIAS={
  cup:['cup','cop','cub'],plate:['plate'],spoon:['spoon','spon'],
  bowl:['bowl','ball','bol'],fork:['fork','folk'],knife:['knife','nife'],
  chopsticks:['chopsticks','chopstick','chop stick','chop sticks'],
  glass:['glass','glas','class'],napkin:['napkin'],pot:['pot'],cake:['cake'],
  milk:['milk'],juice:['juice'],apple:['apple'],bread:['bread','bred'],
  noodles:['noodles','noodle'],rice:['rice'],
  mom:['mom','mum','mommy','mummy','mama','mother'],
  dad:['dad','daddy','dada','father','papa'],
  grandma:['grandma','grandmother','granny','nana','granma'],
  grandpa:['grandpa','grandfather','grandad','granddad'],
  sister:['sister'],brother:['brother']
};
function nameMatch(text,id){
  const t=' '+String(text||'').toLowerCase().replace(/[^a-z]+/g,' ')+' ';
  const names=new Set([id].concat(ALIAS[id]||[]));
  if(I[id])names.add(I[id].en.toLowerCase());
  if(P[id]){const en=P[id].en.toLowerCase();names.add(en);en.split(' ').forEach(w=>{if(w.length>2)names.add(w);});}
  return [...names].some(n=>{n=String(n).toLowerCase().trim();if(!n)return false;const re=n.includes(' ')?n.replace(/\s+/g,' '):n+'s?';return new RegExp(' '+re+' ').test(t);});
}
let hardGen=0,hardRec=null,hardResolve=null,teachLong=false,teachT=null,lastAgain=0,hushUntil=0;
function stopHard(){
  hardGen++;G.hardWait=false;
  try{hardRec&&hardRec.stop();}catch(_){}
  hardRec=null;
  $('#hardMic').classList.remove('show','rec');
  $('#teach').classList.remove('show','need');
  $('#teachHint').classList.remove('show');
  $('#sayPrompt').classList.remove('show');
  const r=hardResolve;hardResolve=null;if(r)r();
}
function lockWait(els,targetId){
  if(!G.hard)return Promise.resolve();
  return guard(new Promise(res=>{
    const my=++hardGen;G.hardWait=true;hardResolve=res;
    const mic=$('#hardMic'),teach=$('#teach'),prompt=$('#sayPrompt');
    let early=false,finished=false;
    els.forEach(it=>{
      it.classList.add('locked');
      if(!it.querySelector('.lockb')){const b=document.createElement('div');b.className='lockb';b.textContent='🎤';it.appendChild(b);}
      it.onpointerup=e=>{if(finished||!it.classList.contains('locked'))return;e.stopPropagation();sayWord(it);
        const lb=it.querySelector('.label');bubble(lb?lb.textContent:it.dataset.item,it._x,it._y-it._h-8,1200);};
    });
    prompt.classList.add('show');teach.classList.add('show');
    if(SR)mic.classList.add('show');
    else{teach.classList.add('need');$('#teachHint').classList.add('show');}
    line('Say the names!','說出名字！',{pitch:1.3});
    const locked=()=>els.filter(e=>e.classList.contains('locked'));
    const finish=()=>{if(finished||hardGen!==my)return;finished=true;clearTimeout(earlyT);
      els.forEach(it=>{it.classList.remove('locked');const b=it.querySelector('.lockb');b&&b.remove();it.onpointerup=null;});
      const r=hardResolve;hardResolve=null;stopHard();if(r)r();};
    const maybe=()=>{if(finished||hardGen!==my)return;
      if(!locked().length||(early&&els.some(e=>e.dataset.item===targetId&&!e.classList.contains('locked'))))finish();};
    const unlock=(it,spk)=>{if(!it||!it.classList.contains('locked')||finished)return;
      it.classList.remove('locked');const b=it.querySelector('.lockb');b&&b.remove();
      popIn(it);sfx.pop();sfx.chime();burst(it._x,it._y-it._h*.5,16);
      if(spk!==false){hushUntil=Date.now()+1600;sayWord(it);}maybe();};
    G._unlockNext=()=>{const L=locked();if(L[0])unlock(L[0]);};
    G._unlockAll=()=>{const L=locked();L.forEach(it=>unlock(it,false));if(L.length){hushUntil=Date.now()+1600;say('Great job!',{pitch:1.3}).catch(()=>{});}maybe();};
    const earlyT=setTimeout(()=>{early=true;maybe();},20000);
    function listen(){
      if(!SR||finished||hardGen!==my)return;
      try{speechSynthesis.cancel();}catch(_){}
      try{hardRec&&hardRec.stop();}catch(_){}
      hardRec=null;
      try{
        const rec=new SR();rec.lang='en-US';rec.interimResults=true;rec.maxAlternatives=5;
        try{rec.continuous=true;}catch(_){}
        rec.onresult=ev=>{
          if(finished||hardGen!==my)return;
          const texts=[];
          for(let i=ev.resultIndex;i<ev.results.length;i++){const row=ev.results[i];for(let j=0;j<(row.length||1);j++)texts.push((row[j]&&row[j].transcript)||'');}
          let hit=false;
          els.forEach(it=>{if(it.classList.contains('locked')&&texts.some(t=>nameMatch(t,it.dataset.item))){unlock(it);hit=true;}});
          const last=ev.results[ev.results.length-1];
          const any=texts.join(' ').trim();
          if(!hit&&last&&last.isFinal&&any&&Date.now()>hushUntil){
            const now=Date.now();
            if(now-lastAgain>4000){lastAgain=now;bubble('Say it again! 😊',640,500,1600);say('Say it again!',{pitch:1.3}).catch(()=>{});}
          }
        };
        rec.onerror=e=>{const n=e&&e.error;if(n&&n!=='no-speech'&&n!=='aborted'){teach.classList.add('need');$('#teachHint').classList.add('show');}};
        rec.onend=()=>{mic.classList.remove('rec');if(hardRec===rec)hardRec=null;
          if(!finished&&hardGen===my&&locked().length)setTimeout(()=>{if(!finished&&hardGen===my)listen();},280);};
        hardRec=rec;rec.start();mic.classList.add('rec');
      }catch(_){teach.classList.add('need');$('#teachHint').classList.add('show');mic.classList.remove('rec');hardRec=null;}
    }
    G._hardListen=listen;
  }));
}

function solveAccept(free,cIdx,remain){// accepted neighbor chairs for anchor at cIdx
 const ok=(fr,k)=>{if(k===0)return true;for(let i=0;i<5;i++)if(fr[i]&&fr[i+1]){const f2=fr.slice();f2[i]=f2[i+1]=false;if(ok(f2,k-1))return true;}return false;};
 return [cIdx-1,cIdx+1].filter(n=>n>=0&&n<6&&free[n]&&free[cIdx]&&(()=>{const f=free.slice();f[cIdx]=f[n]=false;return ok(f,remain);})());}

 for(const p of C.family){const h=P[p].h*1.25;const d=spr(p,1450,705,h);await flyTo(d,720,705,700,'ease-out');hop(d);hop(jay);
  line(`This is my ${P[p].en.toLowerCase()}.`,`這是我的${P[p].zh}。`,{pitch:1.3});await sleep(500);await waitNext();
  await flyTo(d,1500,705,500,'ease-in');d.remove();}
 jay.remove();
 // seating puzzle
 const clip=mkClip(),ch=chairs(clip),free=[1,1,1,1,1,1].map(Boolean),seats={};trayPanel(150,1130);
 line("Let's sit at the table!",'我們坐到餐桌旁吧！');await sleep(1800);

 for(let ci=0;ci<C.clues.length;ci++){const cl=C.clues[ci],remain=C.clues.length-ci-1;
  // choose anchor chair: prefer 2 accepted options
  let best=null;shuffle([0,1,2,3,4,5]).forEach(c=>{if(!free[c])return;const acc=solveAccept(free,c,remain);if(acc.length&&(!best||acc.length>best.acc.length))best={c,acc};});
  if(!best){const c=free.findIndex(Boolean);best={c,acc:[c+1].filter(n=>n<6&&free[n])};}

  const els=layoutTray(movers,150,1130,690,140);els.forEach(e=>e.querySelector('.label').textContent=P[e.dataset.item].en);
  best.acc.forEach(a=>ch[a].classList.add('open'));

   expect:{item:`[data-item="${cl.mover}"]`,target:`[data-t="chair${best.acc[0]}"]`},onPick:sayWord,
   hint:m=>{wiggle(an);if(m>=2){const c=els.find(e=>e.dataset.item===cl.mover);c&&c.classList.add('sel');}}});
  const c=+tg.dataset.i;free[c]=false;seats[cl.mover]=c;ch.forEach(x=>x.classList.remove('open'));an.classList.remove('glow');
  els.forEach(e=>e.remove());const d=seatPerson(cl.mover,c,clip);popIn(d);hop(an);praise(SEATX[c],330);
  movers=movers.filter(m=>m!==cl.mover);
  line(`Yes! ${cl.en}`,`對！${cl.zh}`);await sleep(2300);
 }
 G.seats=seats;line('Everyone is here!','大家都到齊了！');[...clip.querySelectorAll('.spr')].forEach(s=>hop(s,2));confetti(70);await sleep(2400);
 await partDone(2,'大家都坐好了！');

function setupMic(){const m=$('#mic');if(!SR)return;m.classList.add('show');if(micBound)return;micBound=true;
 const start=e=>{e.preventDefault();try{speechSynthesis.cancel();}catch(_){}try{rec=new SR();rec.lang='en-US';rec.interimResults=true;rec.maxAlternatives=3;
  let heard=false;rec.onresult=ev=>{if(heard)return;heard=true;G.micHeard=(ev.results[0][0]||{}).transcript;sfx.chime();burst(1180,520,24);bubble('Great talking! 🌟',1100,430,1800);};
  rec.onerror=()=>{};rec.onend=()=>m.classList.remove('rec');rec.start();m.classList.add('rec');}catch(_){m.classList.remove('rec');}};
 const stop=()=>{m.classList.remove('rec');try{rec&&rec.stop();}catch(_){}};
