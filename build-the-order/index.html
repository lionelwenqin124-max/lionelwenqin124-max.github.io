/* Coach's Kitchen - shared styles */
:root {

#app { max-width: 520px; margin: 0 auto; min-height: 100vh; min-height: 100dvh; position: relative; outline: none; }

/* buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: var(--tap);

.btn .en { font-size: .78em; }

.btn.primary:active, .btn.next:active { transform: translateY(3px); box-shadow: 0 2px 0 #1f5c17; }

.btn.small { min-height: 46px; font-size: .95rem; }

.home h1 { font-size: 1.45rem; margin-top: 10px; }
.home .sub { color: var(--muted); margin-top: 6px; font-size: .95rem; }
.home .lv { display: grid; gap: 10px; margin: 18px 0 6px; }
.lv-card { display: flex; align-items: center; gap: 12px; text-align: left; background: var(--card); border: 2px solid var(--edge);

.lv-card .num { flex: 0 0 44px; height: 44px; border-radius: 12px; background: var(--navy); color: #fff; display: grid; place-items: center; font-weight: 900; font-size: 1.3rem; }
.lv-card .t { flex: 1; }
.lv-card .t b { display: block; }

.home .how { text-align: left; background: rgba(255,255,255,.75); border-radius: var(--radius); padding: 12px 14px; margin-top: 14px; font-size: .92rem; }
.home .how li { margin: 6px 0 0 1.2em; }
.home .tools { margin-top: 14px; display: flex; justify-content: center; }
.home .note { margin-top: 10px; color: var(--muted); font-size: .85rem; }

/* stars / coins */
.stars { display: flex; justify-content: center; gap: 6px; }
.stars i { width: 40px; height: 40px; color: #cbd5e1; filter: drop-shadow(0 2px 0 rgba(0,0,0,.15)); }

.heard li i { flex: 0 0 26px; height: 26px; }

.tr-row { display: flex; gap: 10px; align-items: center; margin-top: 8px; }

.tr-en { font-size: 1.08rem; font-weight: 700; }
.tr-zh { margin-top: 8px; padding-top: 8px; border-top: 2px dotted #d9c08f; }
.tipcard { margin-top: 10px; background: #fff7d6; border-radius: 14px; padding: 8px 12px; text-align: left; font-size: .9rem; display: flex; gap: 8px; align-items: flex-start; }
.tipcard .zh, .tipcard .en { display: block; }
.fb .next { margin-top: 14px; }

/* summary */
.sum { padding: 20px 16px calc(28px + env(safe-area-inset-bottom)); text-align: center; }
.sum h2 { font-family: "Arial Black", Arial, sans-serif; font-size: 1.5rem; }
.sum .big { display: flex; justify-content: center; gap: 12px; margin-top: 12px; }
.sum .big div { background: var(--card); border: 2px solid var(--edge); border-radius: 16px; padding: 10px 14px; min-width: 96px; }
.sum .big b { display: block; font-size: 1.6rem; }
.sum table { width: 100%; border-collapse: collapse; margin-top: 14px; background: var(--card); border-radius: 14px; overflow: hidden; font-size: .88rem; text-align: left; }
.sum th, .sum td { padding: 7px 8px; border-bottom: 1px solid var(--edge); vertical-align: top; }
.sum th { background: #f3e6cc; }
.sum td.s { white-space: nowrap; color: #d99a00; }
.sum .btns { display: grid; gap: 10px; margin-top: 16px; }

/* overlay */
.overlay { position: fixed; inset: 0; z-index: 60; background: rgba(20, 12, 4, .7); display: flex; align-items: center; justify-content: center; padding: 20px; }
.overlay[hidden] { display: none; }
.overlay .box { background: #fffaf0; border-radius: 20px; padding: 20px 18px; width: 100%; max-width: 400px; text-align: center; }
.overlay .box h2 { font-size: 1.3rem; }

.overlay .meter > i { display: block; height: 100%; width: 0; background: var(--green); transition: width .2s; }
.ov-btns { display: grid; gap: 10px; margin-top: 14px; }

@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

<script>

(function () {

  var ALL = ['rice', 'chicken', 'broccoli', 'banana', 'pasta', 'eggs', 'salad', 'fried', 'water', 'drink', 'milk', 'cola'];
  var TIPS = [['均衡吃：醣類、蛋白質、蔬菜和水！', 'Balance carbs, protein, veggies & hydration!'],
    ['運動前吃醣類，運動後補蛋白質。', 'Carbs before sports, protein after.'], ['口渴前就要喝水。', 'Drink water before you feel thirsty.']];
  var S = null, waitTimer = null;

  // small seeded random, so each order always shows the same cards in the same places
  function rng(seed) { var h = 0; for (var i = 0; i < seed.length; i++) h = (h * 31 + seed.charCodeAt(i)) | 0; return function () { h = (h * 1103515245 + 12345) | 0; return ((h >>> 0) % 10000) / 10000; }; }

      '<li>' + bi('把食物卡拖到托盤上，或直接點一下。點托盤上的食物可以拿掉。', 'Drag food cards onto the tray, or just tap them. Tap tray food to take it off.') + '</li>' +

      '<li>' + bi('注意數量和「不要 ___」。', 'Listen for numbers and “not ___”.') + '</li></ol>' +
      '<p class="note">' + D.orders.length + ' ' + bi('份餐，分 3 個難度', 'orders in 3 steps') + '</p>' +

    drawTray();
  }
  function add(id) { S.tray[id] = Math.min(5, (S.tray[id] || 0) + 1); drawTray(); var t = $('#tray'); t.classList.remove('got'); void t.offsetWidth; t.classList.add('got'); }
  function drawTray() {
    var el = $('#titems'); if (!el) return;
    var ids = Object.keys(S.tray);
    el.innerHTML = ids.map(function (id) {
      return '<button class="ti" data-f="' + id + '" aria-label="拿掉 Remove ' + D.foods[id].en + '"><span class="ic">' + A.food(id) + '</span>' + (S.tray[id] > 1 ? '<em>×' + S.tray[id] + '</em>' : '') + '</button>';
    }).join('');
    $('.tlabel').style.display = ids.length ? 'none' : '';
    $$('.ti', el).forEach(function (b) { b.addEventListener('click', function () { var id = b.dataset.f; if (--S.tray[id] <= 0) delete S.tray[id]; drawTray(); }); });
    $('#rleft').textContent = S.replays + ' left';
    $('#replay').disabled = !S.heard || S.replays < 1 || Player.busy();
    $('#serve').disabled = !S.heard || !ids.length;
  }

  /* drag a card onto the tray, or tap it */
  function bindCard(c) {
    var start = null, ghost = null;
    c.addEventListener('pointerdown', function (e) { if (e.button > 0) return; start = { x: e.clientX, y: e.clientY, id: e.pointerId }; try { c.setPointerCapture(e.pointerId); } catch (x) {} });
    c.addEventListener('pointermove', function (e) {
      if (!start) return;
      var dx = e.clientX - start.x, dy = e.clientY - start.y;
      if (!ghost && Math.abs(dx) + Math.abs(dy) > 10) {
        ghost = document.createElement('div'); ghost.className = 'dragghost'; ghost.innerHTML = $('.ic', c).innerHTML; document.body.appendChild(ghost);
      }
      if (ghost) { ghost.style.left = e.clientX + 'px'; ghost.style.top = e.clientY + 'px'; $('#tray').classList.toggle('over', overTray(e)); e.preventDefault(); }
    });
    function end(e, cancel) {
      if (!start) return;
      if (ghost) { if (!cancel && overTray(e)) add(c.dataset.f); ghost.remove(); ghost = null; $('#tray').classList.remove('over'); }
      else if (!cancel) add(c.dataset.f);
      start = null;
    }
    c.addEventListener('pointerup', function (e) { end(e, false); });
    c.addEventListener('pointercancel', function (e) { end(e, true); });
    c.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); add(c.dataset.f); } });
  }
  function overTray(e) { var r = $('#tray').getBoundingClientRect(); return e.clientX >= r.left - 10 && e.clientX <= r.right + 10 && e.clientY >= r.top - 10 && e.clientY <= r.bottom + 10; }

  /* gentle patience bar: slowly drains to 30% and stops there, with no penalty */
  function startWait() { stopWait(); var t0 = Date.now(); waitTimer = setInterval(function () { var f = Math.max(0.3, 1 - (Date.now() - t0) / 150000); var w = $('#wbar'); if (!w) return stopWait(); w.style.width = Math.round(f * 100) + '%'; w.className = f < 0.5 ? 'mid' : ''; }, 1000); }
  function stopWait() { if (waitTimer) clearInterval(waitTimer); waitTimer = null; }

  function serve() {
    if (!S.heard) return;
    Player.stop(); stopWait();
    var res = K.grade(S.o, S.tray);
    res.stars = Math.max(0, 3 - res.errors);
    res.coins = [0, 10, 20, 30][res.stars] + (res.perfect && S.replays === 1 ? 10 : 0);
    S.coins += res.coins; S.rows.push({ o: S.o, stars: res.stars, coins: res.coins, perfect: res.perfect, replay: S.replays === 0 });
    var last = S.i === D.orders.length - 1;
    var host = document.createElement('div'); app.innerHTML = ''; app.appendChild(host);
    K.feedback(host, S.o, res, {
      why: res.perfect && S.replays === 1 ? { zh: '只聽一次就全對，+10 金幣！', en: 'Perfect on one listen: +10 bonus coins!' } : null,
      nextZh: last ? '看總成績' : '下一位客人', nextEn: last ? 'See my score' : 'Next customer',
      onNext: function () { if (last) summary(); else { S.i++; step(); } }
    });
    window.scrollTo(0, 0);
  }

  function summary() {
    var r = S.rows, perfect = r.filter(function (x) { return x.perfect; }).length, st = r.reduce(function (a, x) { return a + x.stars; }, 0);
    var rate = st / (3 * r.length), big = rate >= 0.85 ? 3 : rate >= 0.6 ? 2 : rate >= 0.3 ? 1 : 0;
    app.innerHTML = '<div class="sum"><h2>' + bi('今天辛苦了，教練！', 'Great shift, Coach!') + '</h2>' + K.stars(big) +
      '<div class="big"><div><b>' + perfect + ' / ' + r.length + '</b>' + bi('全對', 'Perfect orders') + '</div><div><b>' + st + ' / ' + 3 * r.length + '</b>' + bi('星星', 'Stars') + '</div><div><b>' + S.coins + '</b>' + bi('金幣', 'Coins') + '</div></div>' +
      '<table><tr><th>#</th><th>' + bi('客人點的餐', 'Order') + '</th><th>' + bi('結果', 'Result') + '</th></tr>' +
      r.map(function (x) { return '<tr><td>' + x.o.id + '</td><td><b>' + x.o.customer.name + '</b><br><small lang="en">' + K.esc(x.o.en) + '</small></td><td class="s">' + '★'.repeat(x.stars) + '☆'.repeat(3 - x.stars) + '<br>+' + x.coins + (x.replay ? '<br><small>🔁</small>' : '') + '</td></tr>'; }).join('') +
      '</table><div class="btns"><button class="btn primary block" id="again">' + bi('再玩一次', 'Play again') + '</button><button class="btn ghost block" id="home">' + bi('回首頁', 'Home') + '</button></div></div>';
    K.playSfx(big >= 2 ? 'correct' : 'wrong');
    $('#again').addEventListener('click', function () { S = { i: 0, coins: 0, rows: [] }; step(); });
    $('#home').addEventListener('click', home);
    window.scrollTo(0, 0);
  }
  window.__build = { state: function () { return S; } };
  home();
})();

</script>
</body>
