/* Coach's Kitchen - shared styles */
:root {
  --ink: #2a1a0e; --muted: #6b5644; --card: #fffaf0; --edge: #e6d3b3;

  --ok: #15803d; --ok-soft: #dcfce7; --bad: #b91c1c; --bad-soft: #fee2e2;
  --radius: 18px; --tap: 56px;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; height: 100%; }
body {
  margin: 0; min-height: 100%; color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Noto Sans CJK TC", "Microsoft JhengHei", "Heiti TC", "Segoe UI", Roboto, Arial, sans-serif;
  font-size: 16px; line-height: 1.4; -webkit-tap-highlight-color: transparent;
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;

button { font: inherit; color: inherit; touch-action: manipulation; cursor: pointer; }
svg { display: block; width: 100%; height: 100%; }
h1, h2, h3, p, ul { margin: 0; padding: 0; }
.zh { display: block; }
.en { display: block; font-size: .8em; font-weight: 600; opacity: .8; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
:focus-visible { outline: 3px solid #f59e0b; outline-offset: 2px; }
#app { max-width: 520px; margin: 0 auto; min-height: 100vh; min-height: 100dvh; position: relative; outline: none; }

/* buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: var(--tap);
  padding: 8px 18px; border-radius: 16px; border: 0; font-weight: 800; text-align: center; line-height: 1.2; }
.btn .en { font-size: .78em; }
.btn.block { display: flex; width: 100%; }
.btn.primary, .btn.next { background: linear-gradient(#52b43c, var(--green-dk)); color: #fff; box-shadow: 0 5px 0 #1f5c17, 0 8px 18px rgba(0,0,0,.18); font-size: 1.25rem; }
.btn.primary:active, .btn.next:active { transform: translateY(3px); box-shadow: 0 2px 0 #1f5c17; }
.btn.ghost { background: #fff; border: 2px solid var(--edge); color: var(--ink); }
.btn.small { min-height: 46px; font-size: .95rem; }
.btn .chev { font-size: 1.6em; line-height: 1; }
.btn:disabled { filter: grayscale(.7); opacity: .55; }

/* home */
.home { padding: 26px 18px calc(28px + env(safe-area-inset-bottom)); text-align: center; }
.logo { width: 190px; margin: 0 auto 8px; background: radial-gradient(#8a5a2b, #5e3a17); color: #fff; border-radius: 50%;
  aspect-ratio: 1; display: grid; place-items: center; border: 6px solid #c89a5d; box-shadow: 0 8px 22px rgba(0,0,0,.25); }
.logo .hat { width: 54px; height: 44px; margin: 0 auto -2px; }
.logo b { display: block; font-family: "Arial Black", Arial, sans-serif; font-size: 1.55rem; line-height: 1.02; color: #fff; text-shadow: 0 2px 0 #3b2208; }
.logo b + b { color: var(--gold); }
.home h1 { font-size: 1.45rem; margin-top: 10px; }
.home .sub { color: var(--muted); margin-top: 6px; font-size: .95rem; }
.home .lv { display: grid; gap: 10px; margin: 18px 0 6px; }
.lv-card { display: flex; align-items: center; gap: 12px; text-align: left; background: var(--card); border: 2px solid var(--edge);
  border-radius: var(--radius); padding: 12px 14px; box-shadow: 0 3px 0 var(--edge); }
.lv-card .num { flex: 0 0 44px; height: 44px; border-radius: 12px; background: var(--navy); color: #fff; display: grid; place-items: center; font-weight: 900; font-size: 1.3rem; }
.lv-card .t { flex: 1; }
.lv-card .t b { display: block; }
.lv-card .t small { display: block; color: var(--muted); }
.home .how { text-align: left; background: rgba(255,255,255,.75); border-radius: var(--radius); padding: 12px 14px; margin-top: 14px; font-size: .92rem; }
.home .how li { margin: 6px 0 0 1.2em; }
.home .tools { margin-top: 14px; display: flex; justify-content: center; }
.home .note { margin-top: 10px; color: var(--muted); font-size: .85rem; }

/* stars / coins */
.stars { display: flex; justify-content: center; gap: 6px; }
.stars i { width: 40px; height: 40px; color: #cbd5e1; filter: drop-shadow(0 2px 0 rgba(0,0,0,.15)); }
.stars i.on { color: #facc15; }

/* feedback */
.fb { padding: 16px 16px calc(24px + env(safe-area-inset-bottom)); text-align: center; animation: pop .25s ease-out; }
@keyframes pop { from { transform: scale(.96); opacity: 0; } to { transform: none; opacity: 1; } }
.fb-title { font-family: "Arial Black", Arial, sans-serif; font-size: 1.55rem; color: #4a2c0f; }
.fb-title .en { font-size: .7em; }
.fb .stars { margin-top: 8px; }
.fb .stars i { width: 54px; height: 54px; }
.fb-coins { display: inline-flex; align-items: center; gap: 8px; margin-top: 6px; font-size: 1.1rem; color: #92600a; }
.fb-coins svg { width: 34px; height: 34px; }
.fb-coins b { font-size: 1.8rem; color: #d99a00; font-family: "Arial Black", Arial, sans-serif; }
.fb-why { margin-top: 4px; color: var(--bad); font-weight: 700; font-size: .92rem; }
.fb-mid { display: flex; align-items: flex-end; gap: 6px; margin-top: 8px; }
.fb-ath { flex: 0 0 92px; height: 120px; }
.heard { flex: 1; background: #fffdf6; border: 3px solid #5aa63f; border-radius: 18px; padding: 8px; text-align: left; box-shadow: 0 4px 10px rgba(0,0,0,.1); }
.heard h3 { background: #4f9a37; color: #fff; border-radius: 10px; text-align: center; padding: 3px 6px; font-size: 1rem; }
.heard h3 .en, .transcript h3 .en { display: inline; margin-left: 6px; }
.heard ul { list-style: none; margin-top: 6px; }
.heard li { display: flex; gap: 8px; align-items: center; padding: 6px 8px; border-radius: 12px; border: 1.5px solid #e6dcc6; margin-top: 5px; background: #fff; }
.heard li.no { background: var(--bad-soft); border-color: #fca5a5; color: var(--bad); }
.heard li i { flex: 0 0 26px; height: 26px; }
.heard li b { display: block; font-size: .98rem; line-height: 1.2; }
.heard li small { display: block; font-size: .8rem; opacity: .85; }
.transcript { margin-top: 12px; background: #fdf6e3; border: 2px solid #d9c08f; border-radius: 18px; padding: 10px 12px; text-align: left; }
.transcript h3 { display: inline-block; background: #b98545; color: #fff; padding: 2px 12px; border-radius: 10px; font-size: .95rem; }
.tr-row { display: flex; gap: 10px; align-items: center; margin-top: 8px; }
.tr-play { flex: 0 0 48px; height: 48px; border-radius: 50%; border: 2px solid #9ccf8b; background: #eaf7e4; color: #2e7a22; padding: 10px; }
.tr-en { font-size: 1.08rem; font-weight: 700; }
.tr-zh { margin-top: 8px; padding-top: 8px; border-top: 2px dotted #d9c08f; }
.tipcard { margin-top: 10px; background: #fff7d6; border-radius: 14px; padding: 8px 12px; text-align: left; font-size: .9rem; display: flex; gap: 8px; align-items: flex-start; }
.tipcard .zh, .tipcard .en { display: block; }
.fb .next { margin-top: 14px; }

/* summary */
.sum { padding: 20px 16px calc(28px + env(safe-area-inset-bottom)); text-align: center; }
.sum h2 { font-family: "Arial Black", Arial, sans-serif; font-size: 1.5rem; }
.sum .big { display: flex; justify-content: center; gap: 12px; margin-top: 12px; }
.sum .big div { background: var(--card); border: 2px solid var(--edge); border-radius: 16px; padding: 10px 14px; min-width: 96px; }
.sum .big b { display: block; font-size: 1.6rem; }
.sum table { width: 100%; border-collapse: collapse; margin-top: 14px; background: var(--card); border-radius: 14px; overflow: hidden; font-size: .88rem; text-align: left; }
.sum th, .sum td { padding: 7px 8px; border-bottom: 1px solid var(--edge); vertical-align: top; }
.sum th { background: #f3e6cc; }
.sum td.s { white-space: nowrap; color: #d99a00; }
.sum .btns { display: grid; gap: 10px; margin-top: 16px; }

/* overlay */
.overlay { position: fixed; inset: 0; z-index: 60; background: rgba(20, 12, 4, .7); display: flex; align-items: center; justify-content: center; padding: 20px; }
.overlay[hidden] { display: none; }
.overlay .box { background: #fffaf0; border-radius: 20px; padding: 20px 18px; width: 100%; max-width: 400px; text-align: center; }
.overlay .box h2 { font-size: 1.3rem; }
.overlay .box p { margin-top: 8px; color: var(--muted); }
.overlay .meter { height: 10px; background: #eadcc2; border-radius: 99px; overflow: hidden; margin-top: 14px; }
.overlay .meter > i { display: block; height: 100%; width: 0; background: var(--green); transition: width .2s; }
.ov-btns { display: grid; gap: 10px; margin-top: 14px; }

@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

</style>
<style>
/* Rush Hour - café counter look */
body { background: #0f1d3d; }
.home, .sum { background: linear-gradient(#fdf3df, #f4e2bf); min-height: 100vh; min-height: 100dvh; }
.rh { display: flex; flex-direction: column; min-height: 100vh; min-height: 100dvh; background: #6b4423; position: relative; }
.hud { display: flex; align-items: center; justify-content: space-between; gap: 6px; padding: calc(8px + env(safe-area-inset-top)) 10px 8px; background: #f3e7d1; }
.pill { display: flex; align-items: center; gap: 6px; background: var(--navy); color: #fff; border-radius: 99px; padding: 4px 12px 4px 6px; font-weight: 900; font-size: 1.2rem; font-variant-numeric: tabular-nums; }
.pill i { width: 28px; height: 28px; color: #fff; }
.pill.coins { background: #fff; color: var(--ink); border: 2px solid #e6c56b; }
.pill.clock.low { background: #b91c1c; animation: blink 1s infinite; }
@keyframes blink { 50% { opacity: .7; } }
.hud .stars i { width: 30px; height: 30px; }

.scene { position: relative; height: 262px; background: linear-gradient(#1b2f5c 0 62%, #8b5a2b 62% 100%); overflow: hidden; }
.wall { position: absolute; inset: 0; }
.banner { position: absolute; right: 10px; top: 14px; color: #e9b949; font-family: "Arial Black", Arial, sans-serif; font-size: .95rem; line-height: 1; opacity: .9; }
.banner b { margin-left: 4px; }
.sign { position: absolute; left: 10px; top: 12px; background: #7a4a1f; color: #fff6e0; border: 3px solid #c89a5d; border-radius: 10px; padding: 4px 10px 4px 34px; font-family: "Arial Black", Arial, sans-serif; font-size: .78rem; line-height: 1.1; }
.sign .whistle { position: absolute; left: 6px; top: 6px; width: 24px; height: 22px; }
.lvtag { position: absolute; left: 132px; top: 16px; background: rgba(255,255,255,.15); color: #fff; border-radius: 8px; padding: 2px 8px; font-size: .78rem; font-weight: 700; }
.slots { position: absolute; left: 0; right: 0; bottom: 0; display: flex; justify-content: center; gap: 8px; padding: 0 8px; }
.cust { position: relative; flex: 0 1 200px; height: 206px; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; border-radius: 16px 16px 0 0; cursor: pointer; }
.slots.n2 .cust { flex-basis: 175px; }
.cust.empty { visibility: hidden; }
.cust.sel { background: rgba(255,255,255,.12); box-shadow: inset 0 0 0 3px #facc15; }
.cust.arrive { animation: walkin .5s ease-out; }
@keyframes walkin { from { transform: translateX(-60px); opacity: 0; } to { transform: none; opacity: 1; } }
.cust .body { width: 124px; height: 152px; }
.cust .pat { position: absolute; top: 4px; left: 4px; text-align: center; background: rgba(15,29,61,.75); border-radius: 10px; padding: 3px 6px; color: #fff; }
.cust .pat small { display: block; font-size: .55rem; font-weight: 800; letter-spacing: .03em; }
.hearts { display: flex; gap: 2px; justify-content: center; }
.hearts i { width: 18px; height: 18px; color: #475569; }
.hearts i.on { color: #ef4444; }
.pbar { height: 4px; background: #475569; border-radius: 9px; margin-top: 2px; overflow: hidden; }
.pbar i { display: block; height: 100%; background: #f87171; transition: width .25s linear; }
.cust.low .hearts i.on { animation: blink .6s infinite; }
.bubble { position: absolute; top: 2px; right: 4px; width: 74px; height: 58px; border-radius: 22px; background: #fff; border: 3px solid #1b2f5c; color: #1d4ed8; display: grid; place-items: center; padding: 0; }
.bubble::after { content: ""; position: absolute; left: 10px; bottom: -12px; border: 8px solid transparent; border-top: 10px solid #1b2f5c; }
.bubble .spk { width: 40px; height: 40px; }
.bubble.talking .spk { animation: talk .5s infinite alternate; color: #16a34a; }

.bubble.heard { color: #1d4ed8; }
.dots { display: flex; gap: 5px; } .dots i { width: 9px; height: 9px; border-radius: 50%; background: #94a3b8; animation: blink 1s infinite; } .dots i:nth-child(2) { animation-delay: .2s; } .dots i:nth-child(3) { animation-delay: .4s; }
.cust .tag { position: absolute; bottom: 4px; background: #fff; color: var(--navy); border-radius: 8px; padding: 0 8px; font-weight: 800; font-size: .8rem; }

.counter { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; padding: 8px; background: linear-gradient(#e9d7b4, #d6bd8f); border-top: 6px solid #f5ead3; }
.st { display: flex; flex-direction: column; align-items: center; gap: 2px; background: #fffaf0; border: 0; border-radius: 12px; padding: 4px 2px 5px; box-shadow: 0 3px 0 #b8996a; min-height: 78px; }
.st:active, .st.bump { transform: translateY(2px); box-shadow: 0 1px 0 #b8996a; }
.st .ic { width: 46px; height: 46px; }
.st .lb { background: var(--navy); color: #fff; border-radius: 6px; padding: 1px 4px; width: 94%; text-align: center; line-height: 1.05; }
.st .lb b { display: block; font-size: .58rem; letter-spacing: .02em; }
.st .lb small { display: block; font-size: .62rem; opacity: .85; }

.traybar { flex: 1; background: #7a4a1f; padding: 8px 8px calc(10px + env(safe-area-inset-bottom)); }
.tray { min-height: 74px; background: #f1e3c4; border: 4px solid #d8c29a; border-radius: 16px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; justify-content: center; padding: 6px; box-shadow: inset 0 3px 8px rgba(0,0,0,.12); }
.tray .empty { color: #8b6b47; font-size: .85rem; text-align: center; }
.ti { position: relative; width: 56px; height: 56px; border: 0; background: transparent; padding: 2px; animation: pop .2s; }
.ti .ic { width: 100%; height: 100%; display: block; }
.ti em { position: absolute; right: -4px; bottom: -4px; background: var(--navy); color: #fff; font-style: normal; font-weight: 900; border-radius: 99px; padding: 0 6px; font-size: .85rem; }
.acts { display: grid; grid-template-columns: 1.1fr .8fr 1.5fr; gap: 8px; margin-top: 8px; }
.rp { padding: 4px 8px; gap: 6px; background: #fff8e8; border-color: #e6c56b; }
.rp i { width: 26px; height: 26px; color: var(--navy); flex: 0 0 26px; }
.rp span b { display: block; font-size: .95rem; } .rp small { display: block; font-size: .65rem; font-weight: 800; }
.clr { padding: 4px 6px; font-size: .9rem; }
.serve { font-size: 1.3rem; }
.fblayer { position: fixed; inset: 0; z-index: 50; overflow-y: auto; -webkit-overflow-scrolling: touch; background: linear-gradient(#fdf3df, #f4e2bf); max-width: 520px; margin: 0 auto; }
.fblayer[hidden] { display: none; }
@media (max-height: 740px) { .scene { height: 226px; } .cust { height: 176px; } .cust .body { width: 100px; height: 124px; } .st { min-height: 70px; } .st .ic { width: 40px; height: 40px; } }

</style>

<script>

(function () {

  /* ---------- audio ----------
     One <audio> element plays every customer line. It is unlocked inside the first tap (Start), so later
     customers can talk without another tap, which iOS Safari and Android Chrome require. HTMLAudioElement

    w(0, 'RIFF'); v.setUint32(4, 36 + n, true); w(8, 'WAVE'); w(12, 'fmt '); v.setUint32(16, 16, true);
    v.setUint16(20, 1, true); v.setUint16(22, 1, true); v.setUint32(24, 22050, true); v.setUint32(28, 44100, true);
    v.setUint16(32, 2, true); v.setUint16(34, 16, true); w(36, 'data'); v.setUint32(40, n, true);
    for (i = 0; i < b.length; i++) s += String.fromCharCode(b[i]);
    return 'data:audio/wav;base64,' + btoa(s);
  })();
  var blob = {};
  var Player = (function () {
    var a = new Audio(); a.preload = 'auto'; a.setAttribute('playsinline', '');
    var cur = null, unlocked = false, guard = null;
    var api = {};
    function settle(r) { var c = cur; cur = null; clearTimeout(guard); if (c) c.resolve(r); }
    a.addEventListener('ended', function () { settle('ended'); });
    a.addEventListener('error', function () {
      if (!cur) return;
      if (cur.alt) { var alt = cur.alt; cur.alt = null; a.src = alt; try { a.play().catch(function () {}); } catch (e) {} return; }
      settle('error');
    });
    api.unlock = function () {
      if (unlocked) return; unlocked = true;
      try { a.src = SILENT; a.load(); var p = a.play(); if (p && p.catch) p.catch(function () {}); } catch (e) {}
    };
    api.play = function (url) {
      api.stop();
      return new Promise(function (resolve) {

        var p; try { p = a.play(); } catch (e) { p = null; }

  })();

  var sfx = {};
  ['correct', 'wrong'].forEach(function (k) { var a = new Audio(); a.preload = 'auto'; a.setAttribute('playsinline', ''); a.src = D.sfx[k]; sfx[k] = a; });
  function primeSfx() { ['correct', 'wrong'].forEach(function (k) { try { sfx[k].load(); } catch (e) {} }); }
  function playSfx(k) { var a = sfx[k]; if (!a) return; try { a.pause(); a.currentTime = 0; } catch (e) {} try { var p = a.play(); if (p && p.catch) p.catch(function () {}); } catch (e) {} }

  function preloadAll(onProgress) {

  /* ---------- level ---------- */
  function startLevel(id) {
    var L = D.levels.filter(function (l) { return l.id === id; })[0];
    S = { L: L, queue: levelOrders(id).slice(), slots: [], active: null, tray: {}, time: L.time, elapsed: 0,
      lastSpawn: -99, talk: [], results: [], coins: 0, paused: true, last: 0, nextAt: 1 };
    for (var i = 0; i < L.slots; i++) S.slots.push(null);
    render();
    K.showOverlay({ zh: L.zh, en: L.en, textZh: L.descZh + '｜時間 ' + fmt(L.time), textEn: L.descEn + ' Time: ' + fmt(L.time),
      buttons: [{ zh: '開始', en: 'Start', fn: function () { K.hideOverlay(); Player.unlock(); S.paused = false; S.last = Date.now(); startTick(); } }] });
  }
  function render() {
    app.innerHTML = '<div class="rh">' +
      '<header class="hud"><div class="pill clock"><i>' + A.icon('clock') + '</i><b id="time">' + fmt(S.time) + '</b></div>' +
      '<div id="lvstars"></div><div class="pill coins"><i>' + A.icon('coin') + '</i><b id="coins">' + (totals.coins + S.coins) + '</b></div></header>' +
      '<div class="scene"><div class="wall"><div class="banner"><b>EAT.</b><b>FUEL.</b><b>WIN.</b></div>' +
      '<div class="sign"><span class="whistle">' + A.icon('hat') + '</span>COACH&#39;S<br>KITCHEN</div><div class="lvtag">' + S.L.zh.split('：')[0] + ' · ' + S.L.en.split(':')[0] + '</div></div>' +
      '<div class="slots" id="slots"></div></div>' +
      '<div class="counter" id="counter">' + STATIONS.map(function (id) {
        var f = D.foods[id];
        return '<button class="st" data-f="' + id + '"><span class="ic">' + A.food(id) + '</span><span class="lb"><b>' + f.en.toUpperCase() + '</b><small>' + f.zh + '</small></span></button>';
      }).join('') + '</div>' +
      '<div class="traybar"><div class="tray" id="tray" aria-label="托盤 Tray"></div>' +
      '<div class="acts"><button class="btn ghost rp" id="replay"><i>' + A.icon('replay') + '</i><span><b>重聽</b><small id="rpn">REPLAY 1x</small></span></button>' +
      '<button class="btn ghost clr" id="clear">' + bi('清空', 'Clear') + '</button>' +
      '<button class="btn primary serve" id="serve">' + bi('上餐！', 'Serve!') + '</button></div></div>' +
      '<div class="fblayer" id="fb" hidden></div></div>';
    $$('.st').forEach(function (b) { b.addEventListener('click', function () { add(b.dataset.f); b.classList.remove('bump'); void b.offsetWidth; b.classList.add('bump'); }); });
    $('#serve').addEventListener('click', serve);
    $('#clear').addEventListener('click', function () { S.tray = {}; drawTray(); });
    $('#replay').addEventListener('click', function () { var c = S.active; if (c) replay(c); });
    drawSlots(); drawTray(); drawHud();
  }
  function add(id) { S.tray[id] = (S.tray[id] || 0) + 1; if (S.tray[id] > 5) S.tray[id] = 5; drawTray(); }
  function drawTray() {
    var t = $('#tray'); if (!t) return;
    var ids = Object.keys(S.tray).filter(function (k) { return S.tray[k] > 0; });
    t.innerHTML = ids.length ? ids.map(function (id) {
      return '<button class="ti" data-f="' + id + '" aria-label="拿掉 Remove ' + D.foods[id].en + '"><span class="ic">' + A.food(id) + '</span>' + (S.tray[id] > 1 ? '<em>×' + S.tray[id] + '</em>' : '') + '</button>';
    }).join('') : '<p class="empty">' + bi('點上面的食物放到托盤', 'Tap food to add it to the tray') + '</p>';
    $$('.ti', t).forEach(function (b) { b.addEventListener('click', function () { var id = b.dataset.f; S.tray[id]--; if (S.tray[id] <= 0) delete S.tray[id]; drawTray(); }); });
    updateButtons();
  }
  function updateButtons() {
    var c = S.active, s = $('#serve'), r = $('#replay');
    if (!s) return;
    s.disabled = !c || !c.heard || !Object.keys(S.tray).length;
    r.disabled = !c || !c.heard || c.replays < 1 || Player.busy();
    $('#rpn').textContent = 'REPLAY ' + (c ? c.replays : 1) + 'x';
  }
  function drawHud() {
    var t = $('#time'); if (!t) return;
    t.textContent = fmt(S.time); t.parentNode.classList.toggle('low', S.time <= 20);
    $('#coins').textContent = totals.coins + S.coins;
    $('#lvstars').innerHTML = K.stars(levelStars(S.results));
  }
  function drawSlots() {
    var el = $('#slots'); if (!el) return;
    el.className = 'slots n' + S.slots.length;
    el.innerHTML = S.slots.map(function (c, i) {
      if (!c) return '<div class="cust empty"></div>';
      var frac = Math.max(0, c.patience / c.max), hearts = Math.ceil(frac * 3 - 0.001), h = '';
      for (var k = 0; k < 3; k++) h += '<i class="' + (k < hearts ? 'on' : '') + '">' + A.icon('heart') + '</i>';
      var state = c.talking ? 'talking' : c.heard ? 'heard' : 'queued';
      return '<div class="cust ' + (S.active === c ? 'sel ' : '') + (c.arrive ? 'arrive' : '') + '" data-i="' + i + '">' +
        '<div class="pat"><div class="hearts">' + h + '</div><div class="pbar"><i style="width:' + Math.round(frac * 100) + '%"></i></div><small>PATIENCE 耐心</small></div>' +
        '<button class="bubble ' + state + '" data-i="' + i + '" aria-label="' + (state === 'heard' ? '重聽 Replay' : state === 'talking' ? '說話中 Talking' : '等一下 Waiting') + '">' +
        (state === 'queued' ? '<span class="dots"><i></i><i></i><i></i></span>' : '<span class="spk">' + A.icon('speaker') + '</span>') + '</button>' +
        '<div class="body">' + A.athlete(c.o.customer, frac < 0.34 ? 'wait' : 'ok') + '</div>' +
        '<div class="tag">' + c.o.customer.name + '</div></div>';
    }).join('');
    $$('.cust[data-i]', el).forEach(function (n) {
      n.addEventListener('click', function (e) {
        var c = S.slots[+n.dataset.i]; if (!c) return;
        if (e.target.closest('.bubble') && S.active === c && c.heard) { replay(c); return; }
        S.active = c; drawSlots(); updateButtons();
      });
    });
    updateButtons();
  }
  function patchSlots() {
    // light update of hearts/bars each tick without rebuilding
    $$('#slots .cust[data-i]').forEach(function (n) {
      var c = S.slots[+n.dataset.i]; if (!c) return;
      var frac = Math.max(0, c.patience / c.max), hearts = Math.ceil(frac * 3 - 0.001);
      $$('.hearts i', n).forEach(function (h, k) { h.classList.toggle('on', k < hearts); });
      $('.pbar i', n).style.width = Math.round(frac * 100) + '%';
      n.classList.toggle('low', frac < 0.34);
    });
  }

  /* ---------- talking ---------- */
  function pumpTalk() {
    if (Player.busy() || S.paused || !S.talk.length) return;
    var c = S.talk.shift();
    if (S.slots.indexOf(c) < 0) return pumpTalk();
    c.talking = true; drawSlots();
    Player.play(c.o.audio).then(function (r) {
      c.talking = false;
      if (r === 'stopped' && !c.heard) { if (S.slots.indexOf(c) > -1) S.talk.unshift(c); }
      else { c.heard = true; c.arrive = false; }
      if (S) { drawSlots(); setTimeout(function () { if (S) pumpTalk(); }, 400); }
    });
  }
  function replay(c) {
    if (!c.heard || c.replays < 1 || Player.busy()) return;
    c.replays--; c.talking = true; drawSlots();
    Player.play(c.o.audio).then(function () { c.talking = false; if (S) drawSlots(); });
  }

  /* ---------- clock ---------- */
  function startTick() { stopTick(); S.last = Date.now(); tickTimer = setInterval(tick, 250); }
  function stopTick() { if (tickTimer) clearInterval(tickTimer); tickTimer = null; }
  function tick() {
    if (!S || S.paused) { if (S) S.last = Date.now(); return; }
    var now = Date.now(), dt = Math.min(1, (now - S.last) / 1000); S.last = now;
    S.time -= dt; S.elapsed += dt;
    // patience only drains once the customer has finished speaking the first time
    for (var i = 0; i < S.slots.length; i++) {
      var c = S.slots[i];
      if (c && c.heard && !c.talking) { c.patience -= dt; if (c.patience <= 0) { leave(c); return; } }
    }
    // arrivals
    var free = S.slots.indexOf(null);
    if (S.queue.length && free > -1 && S.elapsed >= S.nextAt) {
      var o = S.queue.shift();
      var c2 = { o: o, patience: S.L.patience, max: S.L.patience, heard: false, talking: false, replays: 1, arrive: true };
      S.slots[free] = c2; S.lastSpawn = S.elapsed; S.nextAt = S.elapsed + S.L.gap;
      if (!S.active) { S.active = c2; }
      S.talk.push(c2); drawSlots(); pumpTalk();
    }
    if (S.time <= 0) { timeUp(); return; }
    drawHud(); patchSlots(); pumpTalk();
  }

  /* ---------- serving ---------- */
  function finish(c, res, opt) {
    S.paused = true;
    if (Player.busy()) Player.stop();
    var i = S.slots.indexOf(c); if (i > -1) S.slots[i] = null;
    S.talk = S.talk.filter(function (x) { return x !== c; });
    if (S.active === c) S.active = S.slots.filter(Boolean)[0] || null;
    S.results.push({ o: c.o, stars: res.stars, coins: res.coins, perfect: res.perfect, left: !!opt.left });
    S.coins += res.coins; drawHud();
    var fb = $('#fb'); fb.hidden = false;
    K.feedback(fb, c.o, res, {
      left: opt.left, why: opt.why,
      onNext: function () {
        fb.hidden = true; fb.innerHTML = '';
        if (!S.queue.length && !S.slots.some(Boolean)) { levelEnd(false); return; }
        if (!S.slots.some(Boolean)) S.nextAt = Math.min(S.nextAt, S.elapsed + 1);
        S.paused = false; S.last = Date.now(); drawSlots(); pumpTalk();
      }
    });
  }
  function serve() {
    var c = S.active; if (!c || !c.heard) return;
    var res = K.grade(c.o, S.tray);
    res.stars = res.errors === 0 ? 3 : res.errors === 1 ? 1 : 0;
    // accuracy first: coins only for a correct order, plus a speed bonus for hearts left
    res.coins = res.perfect ? 20 + Math.round(10 * Math.max(0, c.patience / c.max)) : 0;
    S.tray = {}; drawTray();
    finish(c, res, { why: res.perfect ? null : { zh: '送錯的餐沒有金幣。', en: 'Wrong orders earn no coins.' } });
  }
  function leave(c) {
    var res = K.grade(c.o, {}); res.stars = 0; res.coins = 0; res.perfect = false;
    res.checks.forEach(function (x) { x.ok = false; x.note = null; });
    finish(c, res, { left: true, why: { zh: '愛心用完了，下次快一點！', en: 'Out of hearts. Try to be a little faster!' } });
  }
  function timeUp() {
    S.paused = true; stopTick(); Player.stop();
    S.slots.concat(S.queue).forEach(function (c) {
      if (!c) return; var o = c.o || c;
      S.results.push({ o: o, stars: 0, coins: 0, perfect: false, left: true, timeUp: true });
    });
    S.slots = S.slots.map(function () { return null; }); S.queue = [];
    levelEnd(true);
  }

  /* ---------- end of level / game ---------- */
  function rows(list) {
    return '<table><tr><th>#</th><th>' + bi('客人', 'Customer') + '</th><th>' + bi('結果', 'Result') + '</th></tr>' +
      list.map(function (r) {
        return '<tr><td>' + r.o.id + '</td><td><b>' + r.o.customer.name + '</b><br><small lang="en">' + K.esc(r.o.en) + '</small></td><td class="s">' +
          (r.timeUp ? '⏱ 時間到' : r.left ? '💔 離開' : '★'.repeat(r.stars) + '☆'.repeat(3 - r.stars)) + '<br>+' + r.coins + '</td></tr>';
      }).join('') + '</table>';
  }
  function levelEnd(byTime) {
    stopTick(); Player.stop();
    var st = levelStars(S.results), perfect = S.results.filter(function (r) { return r.perfect; }).length;
    totals.coins += S.coins; totals.rows = totals.rows.concat(S.results);
    var last = S.L.id === D.levels.length;
    app.innerHTML = '<div class="sum"><h2>' + bi(byTime ? '時間到！' : '關卡完成！', byTime ? 'Time&#39;s up!' : 'Level complete!') + '</h2>' +
      '<p>' + S.L.zh + ' · ' + S.L.en + '</p>' + K.stars(st) +
      '<div class="big"><div><b>' + perfect + ' / ' + S.results.length + '</b>' + bi('全對', 'Perfect orders') + '</div><div><b>+' + S.coins + '</b>' + bi('金幣', 'Coins') + '</div></div>' +
      rows(S.results) + '<div class="btns">' +
      (last ? '<button class="btn primary block" id="final">' + bi('看總成績', 'See final score') + '</button>'
        : '<button class="btn primary block" id="nextlv">' + bi('下一關', 'Next level') + ' <span class="chev">›</span></button>') +
      '<button class="btn ghost block" id="again">' + bi('再玩這一關', 'Play this level again') + '</button>' +
      '<button class="btn ghost block" id="home">' + bi('回首頁', 'Home') + '</button></div></div>';
    K.playSfx(st >= 2 ? 'correct' : 'wrong');
    var lv = S.L.id, lvCoins = S.coins, lvRows = S.results.length;
    if ($('#nextlv')) $('#nextlv').addEventListener('click', function () { startLevel(lv + 1); });
    if ($('#final')) $('#final').addEventListener('click', final);
    $('#again').addEventListener('click', function () { totals.coins -= lvCoins; totals.rows.splice(totals.rows.length - lvRows, lvRows); startLevel(lv); });
    $('#home').addEventListener('click', function () { totals = null; home(); });
    window.scrollTo(0, 0);
  }
  function final() {
    var r = totals.rows, perfect = r.filter(function (x) { return x.perfect; }).length;
    var st = levelStars(r);
    app.innerHTML = '<div class="sum"><h2>' + bi('營業結束！', 'Kitchen closed!') + '</h2>' + K.stars(st) +
      '<div class="big"><div><b>' + perfect + ' / ' + r.length + '</b>' + bi('全對', 'Perfect orders') + '</div><div><b>' + totals.coins + '</b>' + bi('金幣', 'Coins') + '</div></div>' +
      rows(r) + '<div class="btns"><button class="btn primary block" id="again">' + bi('再玩一次', 'Play again') + '</button></div></div>';
    $('#again').addEventListener('click', function () { totals = { coins: 0, rows: [] }; startLevel(1); });
    window.scrollTo(0, 0);
  }

  document.addEventListener('visibilitychange', function () {
    if (document.hidden && S && !S.paused && tickTimer) {
      S.paused = true; Player.stop();
      K.showOverlay({ zh: '暫停', en: 'Paused', textZh: '準備好再繼續。', textEn: 'Continue when you are ready.',
        buttons: [{ zh: '繼續', en: 'Continue', fn: function () { K.hideOverlay(); S.paused = false; S.last = Date.now(); drawSlots(); pumpTalk(); } }] });
    }
  });
  window.__rush = { state: function () { return S; } };
  home();
})();

</script>
</body>
</html>
